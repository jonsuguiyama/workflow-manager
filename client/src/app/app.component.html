<app-header (logout)="onLogout()"></app-header>

<div id="main-content" class="page-content">

<h2 class="section-title">Create new task</h2>
<div class="create-form">
  <label class="field-label sr-only" for="new-task-title">Title</label>
  <input id="new-task-title" placeholder="Title" [(ngModel)]="title" />

  <label class="field-label sr-only" for="new-task-description">Description</label>
  <input id="new-task-description" placeholder="Description" [(ngModel)]="description" />

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="custom-form">
    <mat-select id="new-task-priority" class="custom-select" placeholder="Priority" [(ngModel)]="priority">
      <mat-option value="low">Low</mat-option>
      <mat-option value="medium">Medium</mat-option>
      <mat-option value="high">High</mat-option>
    </mat-select>
  </mat-form-field>

  <button (click)="createTask()">Create</button>
</div>

<h2 class="section-title">Filters</h2>
<div class="filter-bar">
  <label class="field-label sr-only" for="task-search">Search tasks by keyword</label>
  <input
    id="task-search"
    placeholder="Search tasks by keyword"
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange()"
    class="search-input"
  />

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="custom-form">
    <mat-select id="priority-filter" placeholder="Filter tasks by priority" [(ngModel)]="priorityFilter" (selectionChange)="onPriorityFilterChange()">
      <mat-option value="">All priorities</mat-option>
      <mat-option value="low">Low</mat-option>
      <mat-option value="medium">Medium</mat-option>
      <mat-option value="high">High</mat-option>
    </mat-select>
  </mat-form-field>

  <button *ngIf="searchTerm || priorityFilter" class="secondary clear-filters-btn" (click)="clearFilters()">
    Clear filters
  </button>
</div>

<app-edit-modal
  [open]="editMode"
  [title]="editTitle"
  [description]="editDescription"
  [priority]="editPriority"
  (close)="closeEdit()"
  (save)="saveEdit($event)">
</app-edit-modal>

<app-confirm-modal
  [open]="deleteConfirmOpen"
  title="Delete this task?"
  message="This can't be undone."
  confirmLabel="Delete"
  cancelLabel="Cancel"
  (confirmed)="confirmDelete()"
  (cancelled)="closeDeleteConfirm()">
</app-confirm-modal>

<div class="board" cdkDropListGroup>

  <div *ngIf="isLoading()" class="loading-state">
    <div class="spinner"></div>
    <p>Loading tasks...</p>
  </div>

  <ng-container *ngIf="!isLoading()">
    
    <div class="column" id="todoList">
      <h2>To Do</h2>
      
      <div class="task-list"
           cdkDropList
           [cdkDropListData]="todoTasks()"
           (cdkDropListDropped)="onDrop($event, 'todo')">

        <div *ngIf="todoTasks().length === 0 && hasActiveFilters()" class="empty-state">
          <h3>No tasks match the search criteria</h3>
        </div>
        <div *ngIf="todoTasks().length === 0 && !hasActiveFilters()" class="empty-state">
          <span class="empty-icon">📭</span>
          <h3>No tasks yet</h3>
          <p>Create your first task to get started.</p>
        </div>

        <app-task-card
          *ngFor="let task of todoTasks(); trackBy: trackById; let first = first; let last = last"
          cdkDrag
          [task]="task"
          [isFirst]="first"
          [isLast]="last"
          (toggle)="toggleStatus(task)"
          (edit)="startEdit(task)"
          (delete)="deleteTask(task.id)"
          (moveUp)="moveTask(task, 'up')"
          (moveDown)="moveTask(task, 'down')">
        </app-task-card>

      </div>
    </div>

    <div class="column" id="doneList">
      <h2>Done</h2>

      <div class="task-list"
           cdkDropList
           [cdkDropListData]="doneTasks()"
           (cdkDropListDropped)="onDrop($event, 'done')">

        <div *ngIf="doneTasks().length === 0 && hasActiveFilters()" class="empty-state">
          <h3>No tasks match the search criteria</h3>
        </div>
        <div *ngIf="doneTasks().length === 0 && !hasActiveFilters()" class="empty-state">
          <span class="empty-icon">✅</span>
          <h3>No completed tasks</h3>
          <p>Finished tasks will appear here.</p>
        </div>

        <app-task-card
          *ngFor="let task of doneTasks(); trackBy: trackById"
          cdkDrag
          [task]="task"
          (toggle)="toggleStatus(task)"
          (edit)="startEdit(task)"
          (delete)="deleteTask(task.id)">
        </app-task-card>

      </div>
    </div>

  </ng-container>
</div>

</div>

<app-footer></app-footer>
