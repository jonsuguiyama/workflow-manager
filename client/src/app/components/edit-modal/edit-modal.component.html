<div *ngIf="open" class="modal-backdrop" (pointerdown)="onBackdropPointerDown($event)">
  <div class="modal-box edit-box">

    <div class="modal-header">
      <h3>Edit Task</h3>
      <button class="modal-close-btn" aria-label="Close" (click)="close.emit()">✕</button>
    </div>

    <label class="field-label" for="edit-title">Title</label>
    <input
      id="edit-title"
      placeholder="Task Title"
      [(ngModel)]="title"
      class="input"
    />

    <label class="field-label" for="edit-priority">Priority</label>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="custom-form">
      <mat-select id="edit-priority" [(ngModel)]="priority">
        <mat-option value="low">Low</mat-option>
        <mat-option value="medium">Medium</mat-option>
        <mat-option value="high">High</mat-option>
      </mat-select>
    </mat-form-field>

    <label class="field-label" for="edit-description">Description</label>
    <textarea
      id="edit-description"
      placeholder="Task Description"
      [(ngModel)]="description"
      class="textarea"
    ></textarea>
    
    <div class="modal-actions">
      <button class="primary" (click)="onSave()">Save</button>
      <button class="secondary" (click)="close.emit()">Cancel</button>
    </div>

  </div>
</div>
