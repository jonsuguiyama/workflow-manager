<div class="login-container">
  <div id="main-content" class="login-card">
    <h1 class="login-title">Workflow Manager</h1>
    <p class="login-subtitle">A Kanban board with drag-and-drop, priorities, and search you can try right now, no signup needed.</p>
    
    <div *ngIf="isLoading()" class="loading-state">
      <div class="spinner"></div>
      <p>Loading tasks...</p>
    </div>

    <button *ngIf="!isLoading()" class="primary login-btn" (click)="onLoginDemo()">
      Access Live Demo Version
    </button>
  </div>

  <app-footer class="login-footer"></app-footer>
</div>
